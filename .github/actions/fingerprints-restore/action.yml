name: fingerprints-restore
description: >-
  Restores the fingerprints of the tests that passed (tools/ci/affected-tests.sh): main's newest, and on a pull request
  or another branch its own newest too. Sets FINGERPRINTS_KNOWN to a file with both, empty when there are none (then
  every test runs). ../fingerprints-save saves this run's.
runs:
  using: composite
  steps:
    - name: Fingerprint scope
      id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        NUMBER: ${{ github.event.number }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [[ "$EVENT" == pull_request ]]; then
          scope="pr$NUMBER"
        elif [[ "$REF" == refs/heads/main ]]; then
          scope=main
        else
          scope="branch-$REF_NAME"
        fi
        echo "scope=$scope" >> "$GITHUB_OUTPUT"
        echo "FINGERPRINTS_SCOPE=$scope" >> "$GITHUB_ENV"

    # The keys never exist (they name this run): the restore keys pick the newest.
    - name: Restore main's fingerprints
      uses: actions/cache/restore@v6
      with:
        path: build/cache/fingerprints-main
        key: test-fingerprints-linux-main-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: test-fingerprints-linux-main-

    - name: Restore this branch's fingerprints
      if: steps.scope.outputs.scope != 'main'
      uses: actions/cache/restore@v6
      with:
        path: build/cache/fingerprints-own
        key: test-fingerprints-linux-${{ steps.scope.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: test-fingerprints-linux-${{ steps.scope.outputs.scope }}-

    - name: Known fingerprints
      shell: bash
      run: |
        known="$RUNNER_TEMP/known-fingerprints.txt"
        cat build/cache/fingerprints-main/passed.txt build/cache/fingerprints-own/passed.txt 2> /dev/null > "$known" || true
        echo "FINGERPRINTS_KNOWN=$known" >> "$GITHUB_ENV"
        echo "$(wc -l < "$known") known passing fingerprints"
