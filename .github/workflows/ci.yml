# SPDX-License-Identifier: GPL-3.0-or-later
# P-028 experiments, round 1: timings of cold and warm Linux builds (GCC, Clang, mold), the test step's parallelism,
# Linux ASan + UBSan, a Qt built with ThreadSanitizer on Linux, the lint tools on Linux, and ccache on Windows.
# Dispatch only (gh workflow run CI --ref crew/P-028-fast-ci); the real CI comes back before the pull request.
#
# Network safety (CLAUDE.md): nothing here talks to the Soulseek network or to the metadata services. Tests run in a
# network namespace that has nothing but loopback, and the live-server switch stays OFF and is checked.
name: CI

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Jobs to run: any of build, replay, same, lint, windows (empty: all)"
        type: string
        default: ''
      replay:
        description: Compilers to replay with (JSON list of gcc, gcc-g0, gcc-pch, gcc-pch8, clang, clang-22)
        type: string
        default: '["gcc", "clang"]'

permissions:
  contents: read

concurrency:
  group: ci-exp-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_FORCE_DOWNLOADED_BINARIES: 1
  CCACHE_MAXSIZE: 2G

jobs:
  linux-build:
    name: exp · linux ${{ matrix.name }}
    if: inputs.only == '' || contains(inputs.only, 'build')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-bfd
            cc: gcc
            cxx: g++
            linker: ''
            sanitize: ''
            tests: '4 8 16'
          - name: gcc-mold
            cc: gcc
            cxx: g++
            linker: MOLD
            sanitize: ''
            tests: ''
          - name: clang-lld
            cc: clang
            cxx: clang++
            linker: LLD
            sanitize: ''
            tests: '4'
          - name: gcc-asan
            cc: gcc
            cxx: g++
            linker: MOLD
            sanitize: 'address;undefined'
            tests: '4 8'
          - name: clang-asan
            cc: clang
            cxx: clang++
            linker: LLD
            sanitize: 'address;undefined'
            tests: '4 8'
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/cache/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache-exp
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Machine
        run: |
          nproc; free -g; df -h .; gcc --version | head -1; clang --version | head -1 || true
          ls /usr/bin | grep -E '^(clang|clang\+\+|ld\.lld|gcc|g\+\+)(-[0-9]+)?$' || true

      - name: Tools
        run: |
          start=$SECONDS
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends autoconf-archive nasm ccache libgl-dev libegl-dev \
            libglu1-mesa-dev mold lld
          echo "tools: $((SECONDS - start)) s"

      - name: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          triplet: x64-linux-selecta

      - name: Configure and build, cold ccache
        run: |
          start=$SECONDS
          cmake --preset linux -B build/exp -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            ${{ matrix.linker && format('-DCMAKE_LINKER_TYPE={0}', matrix.linker) || '' }} \
            "-DSELECTA_SANITIZE=${{ matrix.sanitize }}" > configure.log 2>&1 || { cat configure.log; exit 1; }
          echo "configure: $((SECONDS - start)) s"
          grep -Eqx 'SELECTA_ENABLE_LIVE_SERVER:[A-Z]+=OFF' build/exp/CMakeCache.txt
          ccache -z
          start=$SECONDS
          cmake --build build/exp -- -k 0 > build.log 2>&1 || { tail -100 build.log; exit 1; }
          echo "cold build: $((SECONDS - start)) s"
          ccache -s
          cp build/exp/.ninja_log ninja-cold.log

      - name: Build summary
        run: |
          python3 - ninja-cold.log <<'EOF'
          import sys
          rows = []
          for line in open(sys.argv[1]):
              if line.startswith('#'):
                  continue
              s, e, _, out, _ = line.rstrip('\n').split('\t')
              rows.append((int(e) - int(s), int(s), int(e), out))
          compile = [r for r in rows if r[3].endswith('.o')]
          link = [r for r in rows if not r[3].endswith('.o')]
          wall = max(r[2] for r in rows) - min(r[1] for r in rows)
          print(f"steps {len(rows)}  wall {wall/1000:.0f} s  compile sum {sum(r[0] for r in compile)/1000:.0f} s"
                f"  other (link, moc, archive) sum {sum(r[0] for r in link)/1000:.0f} s")
          print("slowest non-compile steps:")
          for r in sorted(link, reverse=True)[:12]:
              print(f"  {r[0]/1000:6.1f} s  {r[3]}")
          print("slowest compiles:")
          for r in sorted(compile, reverse=True)[:12]:
              print(f"  {r[0]/1000:6.1f} s  {r[3]}")
          EOF

      - name: Build again, warm ccache
        run: |
          rm -rf build/exp
          start=$SECONDS
          cmake --preset linux -B build/exp -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            ${{ matrix.linker && format('-DCMAKE_LINKER_TYPE={0}', matrix.linker) || '' }} \
            "-DSELECTA_SANITIZE=${{ matrix.sanitize }}" > configure.log 2>&1 || { cat configure.log; exit 1; }
          echo "configure: $((SECONDS - start)) s"
          ccache -z
          start=$SECONDS
          cmake --build build/exp -- -k 0 > build.log 2>&1 || { tail -100 build.log; exit 1; }
          echo "warm build: $((SECONDS - start)) s"
          ccache -s
          du -sh "$CCACHE_DIR"

      - name: Tests (loopback only)
        if: matrix.tests != ''
        run: |
          for jobs in ${{ matrix.tests }}; do
            start=$SECONDS
            sudo unshare --net -- sh -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) \
              --init-groups env USER='$USER' LOGNAME='$USER' HOME='$HOME' PATH='$PATH' LANG=C.UTF-8 \
              UBSAN_OPTIONS='$UBSAN_OPTIONS' QT_QPA_PLATFORM=minimal \
              ctest --test-dir build/exp --output-on-failure --parallel $jobs --timeout 300" > "test-$jobs.log" 2>&1 \
              || true
            echo "tests -j$jobs: $((SECONDS - start)) s"
            tail -5 "test-$jobs.log"
            grep -E 'Failed|Timeout|\*\*\*' "test-$jobs.log" | head -20 || true
          done
          # The 20 slowest tests of the last run
          sed -n 's/^.*Test *#[0-9]*: \([^ ]*\) [ .]*\(Passed\|Failed\|\*\*\*[A-Za-z]*\) *\([0-9.]*\) sec$/\3 \1 \2/p' \
            "test-$jobs.log" | sort -rn | head -20 || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-linux-${{ matrix.name }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

  # What a pull request's build costs with main's ccache: a cold build at 31c7e94, then 22bba78 (P-022: base and
  # governor headers) and d7a1a2a (P-019: app-wide), each in a fresh build folder with the ccache of the one before.
  replay:
    name: exp · replay ${{ matrix.name }}
    if: inputs.only == '' || contains(inputs.only, 'replay')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.replay) }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/cache/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/../ccache-replay
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends autoconf-archive nasm ccache libgl-dev libegl-dev \
            libglu1-mesa-dev mold lld

      - name: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          triplet: x64-linux-selecta

      - name: Replay
        run: |
          # Upstream Clang warns about designated initializers that leave fields to their defaults; Apple Clang doesn't.
          nodfi="-DCMAKE_CXX_FLAGS=-Wno-missing-designated-field-initializers"
          case "${{ matrix.name }}" in
            gcc) flags=(-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_LINKER_TYPE=MOLD) ;;
            gcc-g0) flags=(-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_LINKER_TYPE=MOLD
                           -DCMAKE_C_FLAGS_DEBUG=-g0 -DCMAKE_CXX_FLAGS_DEBUG=-g0) ;;
            clang) flags=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_LINKER_TYPE=LLD "$nodfi") ;;
            # The replayed commits don't have the experiment's file: a copy outside the checkout.
            gcc-pch) cp .github/experiments/pch.cmake "$RUNNER_TEMP/pch.cmake"
                     flags=(-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_LINKER_TYPE=MOLD
                            "-DCMAKE_PROJECT_INCLUDE=$RUNNER_TEMP/pch.cmake" -DCMAKE_CXX_FLAGS=-fpch-preprocess)
                     export CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime ;;
            # The eight targets that take two thirds of a cold build.
            gcc-pch8) cp .github/experiments/pch.cmake "$RUNNER_TEMP/pch.cmake"
                      flags=(-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_LINKER_TYPE=MOLD
                             "-DCMAKE_PROJECT_INCLUDE=$RUNNER_TEMP/pch.cmake" -DCMAKE_CXX_FLAGS=-fpch-preprocess
                             "-DP028_PCH_TARGETS=selecta_app;selecta_core;selecta_core_tests;selecta_ui_tests;selecta_meta;selecta_meta_tests;selecta_slsk_tests;selecta-cli")
                      export CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime ;;
            clang-22) flags=(-DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_LINKER_TYPE=LLD "$nodfi") ;;
          esac
          for commit in 31c7e94 22bba78 d7a1a2a; do
            git checkout -q "$commit"
            rm -rf build/r
            cmake --preset linux -B build/r -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "${flags[@]}" > configure.log 2>&1 || { cat configure.log; exit 1; }
            ccache -z > /dev/null
            start=$SECONDS
            status=0
            cmake --build build/r -- -k 0 > "build-$commit.log" 2>&1 || status=$?
            echo "build $commit: $((SECONDS - start)) s (exit $status)"
            ccache --print-stats | grep -E '^(direct_cache_hit|preprocessed_cache_hit|cache_miss)\s' | tr '\n' ' '; echo
            [[ $status -eq 0 ]] || grep -E 'error|Error' "build-$commit.log" | head -20
          done
          du -sh "$CCACHE_DIR"

      - name: Tests (loopback only)
        run: |
          start=$SECONDS
          sudo unshare --net -- sh -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) \
            --init-groups env USER='$USER' LOGNAME='$USER' HOME='$HOME' PATH='$PATH' LANG=C.UTF-8 \
            QT_QPA_PLATFORM=minimal ctest --test-dir build/r --output-on-failure --parallel 16 --timeout 300" \
            > test.log 2>&1 || true
          echo "tests -j16: $((SECONDS - start)) s"
          grep -E 'tests passed|Total Test time' test.log
          grep -A20 'FAILED' test.log | head -24 || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-replay-${{ matrix.name }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

  # The same tree built cold with each compiler, one after the other on one runner: runners differ by half.
  same-runner:
    name: exp · same runner ${{ matrix.set }}
    if: contains(inputs.only, 'same')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: [a, b]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/cache/vcpkg-archives
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          lscpu | sed -n 's/^Model name: *//p'; nproc
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends autoconf-archive nasm libgl-dev libegl-dev \
            libglu1-mesa-dev mold lld

      - name: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          triplet: x64-linux-selecta

      - name: Cold builds
        run: |
          gcc=(-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_LINKER_TYPE=MOLD)
          quiet="-DCMAKE_PROJECT_INCLUDE=$PWD/.github/experiments/clang.cmake"
          if [[ "${{ matrix.set }}" == a ]]; then configs=(gcc clang-22 clang-21); else configs=(gcc gcc-pch gcc-g0); fi
          for config in "${configs[@]}"; do
            case "$config" in
              gcc) flags=("${gcc[@]}") ;;
              gcc-g0) flags=("${gcc[@]}" -DCMAKE_C_FLAGS_DEBUG=-g0 -DCMAKE_CXX_FLAGS_DEBUG=-g0) ;;
              gcc-pch) flags=("${gcc[@]}" "-DCMAKE_PROJECT_INCLUDE=$PWD/.github/experiments/pch.cmake") ;;
              clang-21) flags=(-DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_LINKER_TYPE=LLD "$quiet") ;;
              clang-22) flags=(-DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_LINKER_TYPE=LLD "$quiet") ;;
            esac
            rm -rf build/c
            cmake --preset linux -B build/c -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF -DSELECTA_CCACHE=OFF "${flags[@]}" \
              > "configure-$config.log" 2>&1 || { cat "configure-$config.log"; exit 1; }
            start=$SECONDS
            status=0
            cmake --build build/c -- -k 0 > "build-$config.log" 2>&1 || status=$?
            echo "cold build $config: $((SECONDS - start)) s (exit $status)"
            [[ $status -eq 0 ]] || grep -E ' error: ' "build-$config.log" | head -10
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-same-runner-${{ matrix.set }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

  lint-tools:
    name: exp · lint tools ${{ matrix.source }}
    if: inputs.only == '' || contains(inputs.only, 'lint')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [brew, apt]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/cache/vcpkg-archives
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends autoconf-archive nasm libgl-dev libegl-dev libglu1-mesa-dev

      - name: Lint tools (Homebrew)
        if: matrix.source == 'brew'
        run: |
          start=$SECONDS
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          brew install llvm clazy cppcheck clang-format
          echo "brew install: $((SECONDS - start)) s"
          brew list --versions llvm clazy cppcheck clang-format
          du -sh /home/linuxbrew/.linuxbrew
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"

      - name: Lint tools (apt)
        if: matrix.source == 'apt'
        run: |
          start=$SECONDS
          apt-cache policy clang-tidy clazy cppcheck clang-format | grep -E '^[a-z]|Candidate'
          apt-cache search --names-only '^clang-tidy-[0-9]+$'
          sudo apt-get install -y -q --no-install-recommends clang-tidy clazy cppcheck clang-format clang-tools
          echo "apt install: $((SECONDS - start)) s"
          clang-tidy --version; clazy-standalone --version; cppcheck --version; clang-format --version
          echo "LLVM_BIN=$(dirname "$(readlink -f "$(command -v clang-tidy)")")" >> "$GITHUB_ENV"

      - name: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          triplet: x64-linux-selecta

      - name: Configure and generated sources
        run: |
          start=$SECONDS
          cmake --preset linux -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DCMAKE_AUTOGEN_ORIGIN_DEPENDS=OFF -DCMAKE_GLOBAL_AUTOGEN_TARGET=ON > configure.log 2>&1 \
            || { cat configure.log; exit 1; }
          echo "configure: $((SECONDS - start)) s"
          start=$SECONDS
          cmake --build --preset linux --target autogen > autogen.log 2>&1 || { tail -50 autogen.log; exit 1; }
          echo "autogen: $((SECONDS - start)) s"

      - name: Lint the files of the last 3 merges
        run: |
          ls "$LLVM_BIN" | grep -E 'clang-tidy|run-clang-tidy|clang-apply' || true
          root=$PWD
          resource_dir="$("$LLVM_BIN/clang" -print-resource-dir 2>/dev/null || clang -print-resource-dir)"
          echo "resource dir: $resource_dir"
          mapfile -t units < <(git diff --name-only --diff-filter=d HEAD~3 HEAD -- src tests tools | grep -E '\.cpp$' \
            | while read -r f; do grep -q "\"file\": \"$root/$f\"" build/linux/compile_commands.json && echo "$f"; done)
          echo "${#units[@]} units: ${units[*]}"
          start=$SECONDS
          git diff --name-only --diff-filter=d HEAD~3 HEAD -- src tests tools | grep -E '\.(cpp|h)$' \
            | xargs clang-format --dry-run --Werror || true
          echo "clang-format: $((SECONDS - start)) s"
          start=$SECONDS
          run_tidy="$(ls "$LLVM_BIN"/run-clang-tidy* 2>/dev/null | head -1)"
          [[ -n "$run_tidy" ]] || run_tidy="$(command -v run-clang-tidy || ls /usr/bin/run-clang-tidy* | head -1)"
          "$run_tidy" -quiet -j "$(nproc)" -p build/linux -clang-tidy-binary "$LLVM_BIN/clang-tidy" \
            "${units[@]/#/$root/}" > tidy.log 2>&1 || true
          echo "clang-tidy (${#units[@]} units): $((SECONDS - start)) s"
          grep -E '^/[^:]+:[0-9]+:[0-9]+: (warning|error):' tidy.log | head -30 || true
          start=$SECONDS
          printf '%s\0' "${units[@]}" | xargs -0 -n 1 -P "$(nproc)" clazy-standalone -p build/linux/compile_commands.json \
            --header-filter=".*/(src|tests|tools)/.*" --extra-arg="-resource-dir=$resource_dir" \
            --extra-arg=-Wno-missing-designated-field-initializers \
            --checks=level0,level1,level2,no-qstring-allocations,no-non-pod-global-static,no-copyable-polymorphic,no-returning-void-expression \
            > clazy.log 2>&1 || true
          echo "clazy (${#units[@]} units): $((SECONDS - start)) s"
          grep -E 'warning:|error:' clazy.log | head -30 || true
          start=$SECONDS
          cppcheck -j "$(nproc)" --project=build/linux/compile_commands.json --library=qt --library=googletest \
            --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem \
            --suppress=returnByReference --suppress='*:*/vcpkg_installed/*' --suppress='*:*/_deps/*' \
            --suppress='*:*_autogen/*' --quiet $(printf -- "--file-filter=$root/%s " "${units[@]}") > cppcheck.log 2>&1 || true
          echo "cppcheck (${#units[@]} units): $((SECONDS - start)) s"
          head -30 cppcheck.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-lint-${{ matrix.source }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: exp · windows ccache
    if: inputs.only == '' || contains(inputs.only, 'windows')
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/cache/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache-exp
    steps:
      - uses: actions/checkout@v7

      - name: Machine
        run: nproc || echo "$NUMBER_OF_PROCESSORS"

      - name: MSVC developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notlike 'VCPKG_*') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: ccache
        run: |
          start=$SECONDS
          version=4.14.1
          curl -fsSL -o ccache.zip "https://github.com/ccache/ccache/releases/download/v$version/ccache-$version-windows-x86_64.zip"
          echo "6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4  ccache.zip" | sha256sum -c
          unzip -q ccache.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-$version-windows-x86_64" >> "$GITHUB_PATH"
          echo "ccache download: $((SECONDS - start)) s"

      - name: vcpkg
        uses: ./.github/actions/vcpkg
        with:
          triplet: x64-windows-selecta

      - name: Configure and build, cold ccache
        run: |
          ccache --version | head -1
          start=$SECONDS
          cmake --preset windows -B build/exp -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DSELECTA_WITH_MEDIA=OFF -DSELECTA_WARNINGS_AS_ERRORS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache > configure.log 2>&1 || { cat configure.log; exit 1; }
          echo "configure: $((SECONDS - start)) s"
          ccache -z
          start=$SECONDS
          cmake --build build/exp -- -k 0 > build.log 2>&1 || { tail -60 build.log; }
          echo "cold build: $((SECONDS - start)) s"
          ccache -s

      - name: Build again, warm ccache
        run: |
          rm -rf build/exp
          cmake --preset windows -B build/exp -DSELECTA_ENABLE_LIVE_SERVER:BOOL=OFF \
            -DSELECTA_WITH_MEDIA=OFF -DSELECTA_WARNINGS_AS_ERRORS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache > configure.log 2>&1 || { cat configure.log; exit 1; }
          ccache -z
          start=$SECONDS
          cmake --build build/exp -- -k 0 > build.log 2>&1 || { tail -60 build.log; }
          echo "warm build: $((SECONDS - start)) s"
          ccache -s
          du -sh "$CCACHE_DIR"

      - name: Tests
        run: |
          start=$SECONDS
          QT_QPA_PLATFORM=minimal ctest --test-dir build/exp --output-on-failure --parallel 4 --timeout 300 > test.log 2>&1 || true
          echo "tests -j4: $((SECONDS - start)) s"
          tail -5 test.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-windows
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
