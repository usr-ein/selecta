<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <!-- Selecta logo, Variant B: big label, 50% of the disc; coarse grooves (9-unit pitch, 2 track gaps); broad soft sheen near the vertical; no rim highlight. -->
  <title>Selecta</title>
  <defs>
    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur-sheen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <linearGradient id="vinyl" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="grooves" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="9" spreadMethod="repeat">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grooves-lit" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="9" spreadMethod="repeat">
      <stop offset="0" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.03"/>
    </radialGradient>
    <mask id="sheen" maskUnits="userSpaceOnUse" x="-512" y="-512" width="1024" height="1024">
      <g filter="url(#blur-sheen)" fill="#fff">
        <path fill-opacity="0.4" d="M0 0L220 -381.1L-337.1 -282.8zM0 0L-220 381.1L337.1 282.8z"/>
        <path d="M0 0L38.3 -438.3L-186 -398.8zM0 0L-38.3 438.3L186 398.8z"/>
      </g>
    </mask>
    <clipPath id="label"><circle r="220"/></clipPath>
    <radialGradient id="paper" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </radialGradient>
    <linearGradient id="label-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512)">
    <circle cy="12" r="440" fill-opacity="0.45" filter="url(#blur-shadow)"/>
    <circle r="440" fill="url(#vinyl)"/>
    <path fill="url(#grooves)" fill-rule="evenodd" d="M-428 0a428 428 0 1 0 856 0a428 428 0 1 0 -856 0zM-246 0a246 246 0 1 0 492 0a246 246 0 1 0 -492 0z"/>
    <g fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="4">
      <circle r="300.6"/>
      <circle r="366.1"/>
    </g>
    <g mask="url(#sheen)">
      <path fill="url(#grooves-lit)" fill-rule="evenodd" d="M-428 0a428 428 0 1 0 856 0a428 428 0 1 0 -856 0zM-246 0a246 246 0 1 0 492 0a246 246 0 1 0 -492 0z"/>
      <path fill="#fff" fill-opacity="0.09" fill-rule="evenodd" d="M-440 0a440 440 0 1 0 880 0a440 440 0 1 0 -880 0zM-220 0a220 220 0 1 0 440 0a220 220 0 1 0 -440 0z"/>
      <g fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="4">
        <circle r="300.6"/>
        <circle r="366.1"/>
      </g>
    </g>
    <circle r="439.2" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
    <g clip-path="url(#label)">
      <path fill="#009B3A" d="M-220 -220H220V220H-220z"/>
      <path fill="#0e0e0e" d="M-220 -220L0 0L-220 220zM220 -220L0 0L220 220z"/>
      <path stroke="#FED100" stroke-width="73.3" d="M-220 -220L220 220M220 -220L-220 220"/>
      <rect x="-220" y="-220" width="440" height="440" fill="url(#paper)"/>
    </g>
    <circle r="217.5" fill="none" stroke="url(#label-edge)" stroke-width="5"/>
    <circle r="15" fill="#0a0a0a" stroke="#000" stroke-opacity="0.35" stroke-width="4.5"/>
  </g>
</svg>
