<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <!-- Selecta logo, Variant A: label 40% of the disc; medium grooves (6-unit pitch, 4 track gaps); soft sheen at 11 and 5 o'clock; thin rim highlight. -->
  <title>Selecta</title>
  <defs>
    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur-sheen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="vinyl" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="grooves" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="6" spreadMethod="repeat">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grooves-lit" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="6" spreadMethod="repeat">
      <stop offset="0" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.03"/>
    </radialGradient>
    <mask id="sheen" maskUnits="userSpaceOnUse" x="-512" y="-512" width="1024" height="1024">
      <g filter="url(#blur-sheen)" fill="#fff">
        <path fill-opacity="0.35" d="M0 0L76.4 -433.3L-337.1 -282.8zM0 0L-76.4 433.3L337.1 282.8z"/>
        <path d="M0 0L-84 -431.9L-213.3 -384.8zM0 0L84 431.9L213.3 384.8z"/>
      </g>
    </mask>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="label"><circle r="176"/></clipPath>
    <radialGradient id="paper" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </radialGradient>
    <linearGradient id="label-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512)">
    <circle id="shadow" cy="12" r="440" fill-opacity="0.45" filter="url(#blur-shadow)"/>
    <circle r="440" fill="url(#vinyl)"/>
    <path fill="url(#grooves)" fill-rule="evenodd" d="M-428 0a428 428 0 1 0 856 0a428 428 0 1 0 -856 0zM-202 0a202 202 0 1 0 404 0a202 202 0 1 0 -404 0z"/>
    <g fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="3">
      <circle r="242.7"/>
      <circle r="290.1"/>
      <circle r="333.1"/>
      <circle r="382.8"/>
    </g>
    <g mask="url(#sheen)">
      <path fill="url(#grooves-lit)" fill-rule="evenodd" d="M-428 0a428 428 0 1 0 856 0a428 428 0 1 0 -856 0zM-202 0a202 202 0 1 0 404 0a202 202 0 1 0 -404 0z"/>
      <path fill="#fff" fill-opacity="0.08" fill-rule="evenodd" d="M-440 0a440 440 0 1 0 880 0a440 440 0 1 0 -880 0zM-176 0a176 176 0 1 0 352 0a176 176 0 1 0 -352 0z"/>
      <g fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="3">
        <circle r="242.7"/>
        <circle r="290.1"/>
        <circle r="333.1"/>
        <circle r="382.8"/>
      </g>
    </g>
    <circle r="438" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <circle r="439.2" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
    <g clip-path="url(#label)">
      <path fill="#009B3A" d="M-176 -176H176V176H-176z"/>
      <path fill="#0e0e0e" d="M-176 -176L0 0L-176 176zM176 -176L0 0L176 176z"/>
      <path stroke="#FED100" stroke-width="58.7" d="M-176 -176L176 176M176 -176L-176 176"/>
      <rect x="-176" y="-176" width="352" height="352" fill="url(#paper)"/>
    </g>
    <circle r="173.5" fill="none" stroke="url(#label-edge)" stroke-width="5"/>
    <circle r="15" fill="#0a0a0a" stroke="#000" stroke-opacity="0.35" stroke-width="4.5"/>
  </g>
</svg>
