        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search Soulseek" aria-label="Search Soulseek" spellcheck="false">
        <kbd>⌘F</kbd>
      </form>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sb-foot" id="sbfoot"></div>
    </aside>
    <div class="main">
      <header class="toolbar" id="toolbar"></header>
      <div class="middle" id="middle">
        <main class="content" id="content" tabindex="-1"></main>
        <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
      </div>
      <section class="player" id="player" aria-label="Preview player">
        <div class="pl-row">
          <div class="pl-left"><div class="pl-art" id="plArt"></div><div class="pl-meta"><div class="pl-title" id="plTitle"></div><div class="pl-sub" id="plSub"></div></div></div>
          <div class="pl-transport">
            <button class="pbtn" data-act="seek-rel" data-v="-5" aria-label="Back 5 seconds" title="Back 5 s (←)"><svg class="ic"><use href="#i-back5"/></svg></button>
            <button class="pbtn big" id="plPlay" data-act="toggle-play" aria-label="Play" title="Play / pause (Space)"><svg class="ic"><use href="#i-play"/></svg></button>
            <button class="pbtn" data-act="seek-rel" data-v="5" aria-label="Forward 5 seconds" title="Forward 5 s (→)"><svg class="ic"><use href="#i-fwd5"/></svg></button>
          </div>
          <div class="pl-right">
            <div class="pl-actions" id="plActions"></div>
            <div class="pl-vol"><svg class="ic" aria-hidden="true"><use href="#i-speaker"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Preview volume"></div>
          </div>
        </div>
        <div class="screen" id="screen">
          <div class="scr-top">
            <span class="st2" id="scrStatus"></span>
            <span class="scr-seg"><button data-act="auto-preview" id="autoBtn" aria-pressed="false" title="Start a preview when the selection rests on a track">Auto-preview</button></span>
            <span class="scr-seg" role="group" aria-label="Zoom">
              <button data-act="zoom" data-v="out" aria-label="Zoom out" title="Zoom out">−</button>
              <button data-act="zoom" data-v="in" aria-label="Zoom in" title="Zoom in">+</button>
            </span>
          </div>
          <canvas class="cv" id="cvZoom" aria-label="Zoomed waveform. Drag to scrub." role="img"></canvas>
          <canvas class="cv" id="cvOver" aria-label="Track overview. Click to seek." role="img"></canvas>
          <div class="scr-tip" id="scrTip" hidden></div>
        </div>
      </section>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sheet-bg" id="sheet" hidden></div>
<script src="app.js"></script>
</body>
</html>
